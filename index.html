<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epland 3D: Yablokin's Adventure</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
            }
        }
    </script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .ui-overlay { pointer-events: none; }
    </style>
</head>
<body class="antialiased select-none">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const Game = () => {
            const [score, setScore] = useState(0);
            const [status, setStatus] = useState('LOADING'); // LOADING, PLAYING, ERROR
            const [message, setMessage] = useState("Загружаю Эпланд...");
            
            const containerRef = useRef(null);
            
            // Refs for game loop access without re-rendering
            const gameState = useRef({
                scene: null,
                camera: null,
                renderer: null,
                player: null,
                mixer: null,
                clock: new THREE.Clock(),
                keys: { w: false, a: false, s: false, d: false },
                apples: [],
                score: 0
            });

            useEffect(() => {
                if (!containerRef.current) return;

                // --- 1. SETUP SCENE ---
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB); // Sky Blue
                scene.fog = new THREE.Fog(0x87CEEB, 10, 50);

                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.set(0, 5, 10);
                camera.lookAt(0, 0, 0);

                const renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.shadowMap.enabled = true;
                containerRef.current.appendChild(renderer.domElement);

                // --- 2. LIGHTING ---
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1);
                dirLight.position.set(10, 20, 10);
                dirLight.castShadow = true;
                dirLight.shadow.camera.top = 20;
                dirLight.shadow.camera.bottom = -20;
                dirLight.shadow.camera.left = -20;
                dirLight.shadow.camera.right = 20;
                scene.add(dirLight);

                // --- 3. GROUND ---
                const groundGeo = new THREE.PlaneGeometry(200, 200);
                const groundMat = new THREE.MeshStandardMaterial({ 
                    color: 0x4ade80, // Green grass
                    roughness: 0.8 
                });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                scene.add(ground);

                // --- 4. APPLES (Procedural) ---
                const apples = [];
                const appleGeo = new THREE.SphereGeometry(0.5, 16, 16);
                const appleMat = new THREE.MeshStandardMaterial({ color: 0xff0000 }); // RED APPLE
                
                for(let i=0; i<20; i++) {
                    const apple = new THREE.Mesh(appleGeo, appleMat);
                    apple.position.set(
                        (Math.random() - 0.5) * 40,
                        0.5,
                        (Math.random() - 0.5) * 40
                    );
                    apple.castShadow = true;
                    scene.add(apple);
                    apples.push(apple);
                }
                gameState.current.apples = apples;

                // --- 5. LOAD CHARACTER ---
                const loader = new GLTFLoader();
                loader.load(
                    './Яблокин.glb',
                    (gltf) => {
                        const model = gltf.scene;
                        model.scale.set(1, 1, 1); // Adjust scale if needed
                        model.position.set(0, 0, 0);
                        model.traverse((node) => {
                            if (node.isMesh) node.castShadow = true;
                        });
                        scene.add(model);
                        gameState.current.player = model;

                        // Animation Mixer
                        if (gltf.animations && gltf.animations.length > 0) {
                            const mixer = new THREE.AnimationMixer(model);
                            // Play the first animation found
                            const action = mixer.clipAction(gltf.animations[0]);
                            action.play();
                            gameState.current.mixer = mixer;
                        }

                        setStatus('PLAYING');
                        setMessage("");
                    },
                    (xhr) => {
                        // Loading progress...
                    },
                    (error) => {
                        console.warn('Яблокин.glb не найден, используем запасной куб!', error);
                        // Fallback Player
                        const geometry = new THREE.BoxGeometry(1, 2, 1);
                        const material = new THREE.MeshStandardMaterial({ color: 0x0000ff }); // Blue George Color
                        const cube = new THREE.Mesh(geometry, material);
                        cube.position.y = 1;
                        cube.castShadow = true;
                        scene.add(cube);
                        gameState.current.player = cube;
                        setStatus('PLAYING');
                        setMessage("Яблокин.glb не найден. Играем за Кубо-Джорджа!");
                    }
                );

                gameState.current.scene = scene;
                gameState.current.camera = camera;
                gameState.current.renderer = renderer;

                // --- 6. CONTROLS ---
                const handleKeyDown = (e) => {
                    const key = e.key.toLowerCase();
                    if (gameState.current.keys.hasOwnProperty(key)) gameState.current.keys[key] = true;
                    if (e.key === 'ArrowUp') gameState.current.keys.w = true;
                    if (e.key === 'ArrowDown') gameState.current.keys.s = true;
                    if (e.key === 'ArrowLeft') gameState.current.keys.a = true;
                    if (e.key === 'ArrowRight') gameState.current.keys.d = true;
                };
                const handleKeyUp = (e) => {
                    const key = e.key.toLowerCase();
                    if (gameState.current.keys.hasOwnProperty(key)) gameState.current.keys[key] = false;
                    if (e.key === 'ArrowUp') gameState.current.keys.w = false;
                    if (e.key === 'ArrowDown') gameState.current.keys.s = false;
                    if (e.key === 'ArrowLeft') gameState.current.keys.a = false;
                    if (e.key === 'ArrowRight') gameState.current.keys.d = false;
                };

                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
                
                // Resize Handler
                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', handleResize);

                // --- 7. GAME LOOP ---
                const animate = () => {
                    requestAnimationFrame(animate);

                    const delta = gameState.current.clock.getDelta();
                    const { player, mixer, keys, apples } = gameState.current;

                    if (mixer) mixer.update(delta);

                    if (player) {
                        const moveSpeed = 5 * delta;
                        const rotateSpeed = 3 * delta;

                        // Movement Logic (Simple Tank Controls for 3D)
                        if (keys.w) {
                            player.translateZ(moveSpeed); // Assuming model faces +Z or -Z. Tweak if moonwalking.
                        }
                        if (keys.s) {
                            player.translateZ(-moveSpeed);
                        }
                        if (keys.a) {
                            player.rotation.y += rotateSpeed;
                        }
                        if (keys.d) {
                            player.rotation.y -= rotateSpeed;
                        }

                        // Camera Follow
                        const relativeCameraOffset = new THREE.Vector3(0, 5, -8); // Behind player
                        const cameraOffset = relativeCameraOffset.applyMatrix4(player.matrixWorld);
                        
                        // Smooth camera
                        camera.position.lerp(cameraOffset, 0.1);
                        camera.lookAt(player.position);

                        // Apple Collision
                        for (let i = apples.length - 1; i >= 0; i--) {
                            const apple = apples[i];
                            const dist = player.position.distanceTo(apple.position);
                            
                            // Rotate apple
                            apple.rotation.y += delta;

                            if (dist < 1.5) {
                                // Collect!
                                scene.remove(apple);
                                apples.splice(i, 1);
                                
                                // Update React State from outside loop
                                setScore(s => s + 1);
                                
                                // Play crunch sound if you have it, or just visual
                            }
                        }
                    }

                    renderer.render(scene, camera);
                };

                animate();

                // Cleanup
                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                    window.removeEventListener('resize', handleResize);
                    if (containerRef.current) {
                        containerRef.current.removeChild(renderer.domElement);
                    }
                };
            }, []);

            return (
                <div className="relative w-full h-full">
                    {/* 3D Canvas Container */}
                    <div ref={containerRef} id="canvas-container"></div>

                    {/* UI Overlay */}
                    <div className="absolute top-0 left-0 w-full h-full ui-overlay p-6 flex flex-col justify-between">
                        
                        {/* Header */}
                        <div className="flex justify-between items-start">
                            <div className="bg-slate-900/80 text-white p-4 rounded-2xl backdrop-blur-md border border-slate-700 shadow-xl">
                                <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-orange-400">
                                    ЯБЛОКИ: {score}
                                </h1>
                                <p className="text-slate-400 text-sm font-semibold mt-1">
                                    Цель: Собери все! 🍎
                                </p>
                            </div>

                            {status === 'LOADING' && (
                                <div className="bg-blue-600 text-white px-4 py-2 rounded-full animate-pulse font-bold">
                                    ЗАГРУЗКА...
                                </div>
                            )}
                        </div>

                        {/* Message / Controls */}
                        <div className="text-center">
                            {message && (
                                <div className="inline-block bg-red-600/90 text-white px-6 py-3 rounded-xl font-bold mb-4 shadow-lg animate-bounce">
                                    {message}
                                </div>
                            )}
                            
                            <div className="bg-slate-900/50 backdrop-blur text-white inline-block px-6 py-3 rounded-full border border-white/10">
                                <p className="text-sm font-mono opacity-80">
                                    УПРАВЛЕНИЕ: <span className="font-bold text-yellow-400">W A S D</span> или <span className="font-bold text-yellow-400">СТРЕЛКИ</span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>
</body>
</html>
