<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epland Sound Button</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- React & ReactDOM (UMD for simple single-file usage) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 2s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useCallback, useEffect } = React;

        // Icons
        const VolumeIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
        );

        const AlertIcon = ({ className }) => (
             <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        const RefreshIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                <path d="M8 16H3v5"></path>
            </svg>
        );

        const ZapIcon = ({ size }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
        );

        const SoundButton = ({ soundUrl, reloadUrl, label = "PLAY" }) => {
            // States: 'IDLE', 'SHOOTING', 'RELOADING', 'ERROR'
            const [status, setStatus] = useState('IDLE');

            const playSequence = useCallback(() => {
                if (status !== 'IDLE') return; // Prevent spamming

                try {
                    setStatus('SHOOTING');
                    
                    // 1. Play Shoot Sound
                    const shootAudio = new Audio(soundUrl);
                    
                    shootAudio.onended = () => {
                        // 2. When shoot ends, start Reload
                        setStatus('RELOADING');
                        const reloadAudio = new Audio(reloadUrl);
                        
                        reloadAudio.onended = () => {
                            // 3. When reload ends, back to IDLE
                            setStatus('IDLE');
                        };

                        reloadAudio.onerror = (e) => {
                            console.error("Failed to load reload audio:", e);
                            setStatus('IDLE'); // Recover to IDLE even if reload fails
                        };

                        reloadAudio.play().catch(e => {
                            console.error("Reload playback failed:", e);
                            setStatus('IDLE');
                        });
                    };

                    shootAudio.onerror = (e) => {
                        console.error("Failed to load shoot audio:", e);
                        setStatus('ERROR');
                        setTimeout(() => setStatus('IDLE'), 2000);
                    };

                    const playPromise = shootAudio.play();
                    if (playPromise !== undefined) {
                        playPromise.catch((error) => {
                            console.error("Audio playback failed:", error);
                            setStatus('ERROR');
                            setTimeout(() => setStatus('IDLE'), 2000);
                        });
                    }
                } catch (err) {
                    console.error("Error initializing audio:", err);
                    setStatus('ERROR');
                    setTimeout(() => setStatus('IDLE'), 2000);
                }
            }, [soundUrl, reloadUrl, status]);

            // Determine UI based on status
            const isShooting = status === 'SHOOTING';
            const isReloading = status === 'RELOADING';
            const isError = status === 'ERROR';

            let buttonColorClass = 'bg-red-500 hover:bg-red-400 hover:-translate-y-1 hover:shadow-[0_15px_30px_rgba(220,38,38,0.4)]';
            let icon = <VolumeIcon className="mb-2" />;
            let text = label;

            if (isShooting) {
                buttonColorClass = 'bg-red-600 scale-95 shadow-inner cursor-default';
                icon = <VolumeIcon className="mb-2 scale-125" />;
                text = "БАБАХ!";
            } else if (isReloading) {
                buttonColorClass = 'bg-orange-500 scale-100 cursor-wait shadow-[0_0_20px_rgba(249,115,22,0.4)]';
                icon = <RefreshIcon className="mb-2 animate-spin-slow" />;
                text = "ЗАРЯЖАЮ...";
            } else if (isError) {
                buttonColorClass = 'bg-slate-700 cursor-not-allowed';
                icon = <AlertIcon className="text-red-400 mb-2" />;
                text = "ERROR";
            }

            return (
                <div className="flex flex-col items-center gap-4">
                    <button
                        onClick={playSequence}
                        disabled={status !== 'IDLE'}
                        className={`
                        relative group w-48 h-48 rounded-full 
                        border-8 border-slate-700
                        flex items-center justify-center
                        transition-all duration-200 ease-out
                        outline-none focus:ring-4 focus:ring-red-500/50
                        shadow-[0_10px_20px_rgba(0,0,0,0.5),inset_0_-5px_10px_rgba(0,0,0,0.3)]
                        ${buttonColorClass}
                        `}
                        aria-label="Play Sound Sequence"
                    >
                        <div className="absolute top-4 left-10 w-16 h-8 bg-white/20 rounded-full blur-md skew-x-12 pointer-events-none"></div>
                        <div className="flex flex-col items-center justify-center text-white z-10 pointer-events-none select-none">
                            {icon}
                            <span className="font-black text-xl tracking-wider uppercase drop-shadow-md">
                                {text}
                            </span>
                        </div>
                        {isShooting && (
                            <span className="absolute inset-0 rounded-full overflow-hidden pointer-events-none">
                                <span className="absolute inset-0 rounded-full bg-white/30 animate-ping"></span>
                            </span>
                        )}
                    </button>
                    
                    {isError && (
                        <p className="text-red-400 text-sm font-medium animate-pulse max-w-[200px] text-center">
                           Check console. Files missing?
                        </p>
                    )}
                </div>
            );
        };

        const App = () => {
            return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white relative overflow-hidden">
                
                {/* Background decoration */}
                <div className="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
                    <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600/20 rounded-full blur-3xl opacity-50 animate-pulse"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-red-600/20 rounded-full blur-3xl opacity-50 animate-pulse delay-1000"></div>
                </div>

                <div className="z-10 text-center space-y-8 p-6">
                    <header className="space-y-2">
                    <h1 className="text-4xl md:text-6xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-red-400">
                        Epland Arsenal
                    </h1>
                    <p className="text-slate-400 text-lg md:text-xl font-light">
                        Нажмите для выстрела и перезарядки
                    </p>
                    </header>

                    <main className="flex justify-center items-center py-12">
                    <div className="p-10 bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 rounded-3xl shadow-2xl">
                        <SoundButton 
                        soundUrl="./0x01be5440.mp3" 
                        reloadUrl="./sfx00078.mp3"
                        label="ОГОНЬ" 
                        />
                    </div>
                    </main>

                    <footer className="text-slate-500 text-sm">
                    <div className="flex items-center justify-center gap-2">
                        <ZapIcon size={16} />
                        <span>Powered by George Technologies (Blue)</span>
                    </div>
                    <p className="mt-2 text-xs opacity-50">Files: 0x01be5440.mp3, sfx00078.mp3</p>
                    </footer>
                </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
